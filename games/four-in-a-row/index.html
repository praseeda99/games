<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="../../manifest.json">
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<title>Four in a Row</title>
<link rel="stylesheet" href="../shared/gz.css">
<style>
  :root { --a: #ff4d6d; --b: #ffd23f; }
  #grid { width: var(--w); aspect-ratio: 7 / 6; display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(6, 1fr);
    background: #2b2bb8; border-radius: 16px; padding: 6px; box-sizing: border-box; gap: 4px; box-shadow: 0 0 30px rgba(60, 60, 255, .35); overflow: hidden; }
  .hole { border-radius: 50%; background: #0b0b1a; position: relative; box-shadow: inset 0 3px 6px rgba(0, 0, 0, .6); }
  .disc { position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 -4px 8px rgba(0, 0, 0, .3); }
  .disc.s0 { background: #ff4d6d; } .disc.s1 { background: #ffd23f; }
  .disc.drop { animation: drop .35s cubic-bezier(.5, 0, .75, 1); }
  @keyframes drop { from { transform: translateY(var(--from)); } }
  .disc.win { box-shadow: 0 0 0 3px #fff, 0 0 18px #fff; }
  .disc.last::after { content: ''; position: absolute; inset: 38%; border-radius: 50%; background: rgba(0, 0, 0, .25); }
  #arrows { width: var(--w); display: grid; grid-template-columns: repeat(7, 1fr); height: 22px; padding: 0 6px; box-sizing: border-box; }
  #arrows span { text-align: center; opacity: 0; color: var(--c); font-size: 14px; }
  #arrows.on span { opacity: .45; }
</style>
</head>
<body>
<script src="../shared/turn.js"></script>
<script>
const COLS = 7, ROWS = 6;
const LINES = []; // every group of 4 cells in a line
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
  for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
    const cells = [0, 1, 2, 3].map(k => [r + dr * k, c + dc * k]);
    if (cells.every(([rr, cc]) => rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS)) LINES.push(cells.map(([rr, cc]) => rr * COLS + cc));
  }
}

function findWin(b) {
  for (const L of LINES) {
    const v = b[L[0]];
    if (v >= 0 && v === b[L[1]] && v === b[L[2]] && v === b[L[3]]) return { side: v, cells: L };
  }
  return null;
}

function dropRow(b, col) {
  for (let r = ROWS - 1; r >= 0; r--) if (b[r * COLS + col] < 0) return r;
  return -1;
}

// ---------- computer ----------
const ORDER = [3, 2, 4, 1, 5, 0, 6]; // try the middle first
function evalBoard(b, side) {
  let score = 0;
  for (let r = 0; r < ROWS; r++) score += b[r * COLS + 3] === side ? 3 : b[r * COLS + 3] === 1 - side ? -3 : 0;
  for (const L of LINES) {
    let mine = 0, theirs = 0;
    for (const i of L) { if (b[i] === side) mine++; else if (b[i] === 1 - side) theirs++; }
    if (mine && theirs) continue;
    if (mine === 3) score += 5; else if (mine === 2) score += 2;
    if (theirs === 3) score -= 6; else if (theirs === 2) score -= 2;
  }
  return score;
}
function negamax(b, side, depth, alpha, beta, filled) {
  if (filled === COLS * ROWS) return 0;
  if (depth === 0) return evalBoard(b, side);
  let best = -Infinity;
  for (const c of ORDER) {
    const r = dropRow(b, c);
    if (r < 0) continue;
    const i = r * COLS + c;
    b[i] = side;
    let v;
    if (winsAt(b, i, side)) v = 10000 + depth;
    else v = -negamax(b, 1 - side, depth - 1, -beta, -alpha, filled + 1);
    b[i] = -1;
    if (v > best) best = v;
    if (v > alpha) alpha = v;
    if (alpha >= beta) break;
  }
  return best;
}
function winsAt(b, i, side) {
  const r = Math.floor(i / COLS), c = i % COLS;
  for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
    let n = 1;
    for (const s of [1, -1]) {
      let rr = r + dr * s, cc = c + dc * s;
      while (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS && b[rr * COLS + cc] === side) { n++; rr += dr * s; cc += dc * s; }
    }
    if (n >= 4) return true;
  }
  return false;
}

let gridEl, holes = [], arrowsEl, api;

GZ.turnGame({
  id: 'four',
  title: 'Four in a Row',
  sides: [{ name: 'Red', color: '#ff4d6d' }, { name: 'Yellow', color: '#ffd23f' }],
  modes: ['online', 'local', 'cpu'],
  help: `<ul><li>Take turns dropping a disc into a column.</li><li>Discs fall to the lowest empty spot.</li>
    <li>First to get <b>4 in a row</b> wins — across, up-down, or diagonal.</li><li>Tap anywhere in a column to drop.</li></ul>`,

  init: () => ({ b: Array(COLS * ROWS).fill(-1), n: 0, last: -1, win: null }),
  turn: s => s.n % 2,
  apply(s, col, side) {
    if (s.win || s.n === COLS * ROWS || !Number.isInteger(col) || col < 0 || col >= COLS) return null;
    const r = dropRow(s.b, col);
    if (r < 0) return null;
    const b = s.b.slice();
    b[r * COLS + col] = side;
    return { b, n: s.n + 1, last: r * COLS + col, win: findWin(b) };
  },
  result(s) {
    if (s.win) return { winner: s.win.side, reason: 'four in a row' };
    if (s.n === COLS * ROWS) return { winner: null, reason: 'the board is full' };
    return null;
  },

  ai(s, side, level) {
    const b = s.b.slice();
    const legal = ORDER.filter(c => dropRow(b, c) >= 0);
    // Always take a win, and (above Easy) always block one
    for (const who of level === 0 ? [side] : [side, 1 - side]) {
      for (const c of legal) {
        const i = dropRow(b, c) * COLS + c;
        b[i] = who;
        const w = winsAt(b, i, who);
        b[i] = -1;
        if (w) return c;
      }
    }
    if (level === 0 && Math.random() < 0.5) return legal[Math.floor(Math.random() * legal.length)];
    const depth = [2, 5, 7][level];
    let best = legal[0], bestV = -Infinity;
    for (const c of legal) {
      const i = dropRow(b, c) * COLS + c;
      b[i] = side;
      const v = -negamax(b, 1 - side, depth - 1, -Infinity, Infinity, s.n + 1) + Math.random() * (level === 2 ? 0.5 : 3);
      b[i] = -1;
      if (v > bestV) { bestV = v; best = c; }
    }
    return best;
  },

  mount(stage, a) {
    api = a;
    stage.insertAdjacentHTML('beforeend', '<div id="arrows"></div><div id="grid"></div>');
    gridEl = stage.querySelector('#grid');
    arrowsEl = stage.querySelector('#arrows');
    arrowsEl.innerHTML = '<span>▼</span>'.repeat(COLS);
    for (let i = 0; i < COLS * ROWS; i++) {
      const h = document.createElement('div');
      h.className = 'hole';
      h.onclick = () => api.play(i % COLS);
      gridEl.appendChild(h);
      holes.push(h);
    }
  },
  draw(s, view) {
    const winCells = s.win ? s.win.cells : [];
    holes.forEach((h, i) => {
      const v = s.b[i];
      if (v < 0) { h.innerHTML = ''; return; }
      let d = h.firstChild;
      if (!d || !d.classList.contains('s' + v)) {
        h.innerHTML = '';
        d = document.createElement('div');
        d.className = 'disc s' + v;
        if (i === s.last) { // animate the newest disc falling from the top
          d.style.setProperty('--from', `calc(-${Math.floor(i / COLS) + 1} * (100% + 4px) - 20px)`);
          d.classList.add('drop');
        }
        h.appendChild(d);
      }
      d.classList.toggle('win', winCells.includes(i));
      d.classList.toggle('last', i === s.last && !s.win);
    });
    arrowsEl.classList.toggle('on', view.canPlay);
    arrowsEl.style.setProperty('--c', s.n % 2 ? '#ffd23f' : '#ff4d6d');
  },
});
</script>
</body>
</html>
